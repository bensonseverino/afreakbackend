name = "afreakcms"
pages_build_output_dir = "./dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "afreak-db"
database_id = "e8529807-3fc0-4a86-9ee4-ba1946953f22"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "afreak-products"

[vars]
SITE_URL = "https://afreak.pages.dev"
# Country used to normalise phone numbers typed without a country code.
DEFAULT_PHONE_COUNTRY = "KE"
CURRENCY = "EUR"
FREE_SHIPPING_THRESHOLD_CENTS = "15000"
FLAT_SHIPPING_CENTS = "600"
EXPRESS_SHIPPING_CENTS = "1200"
# Display-rate cache lifetime. Currencies are display-only; checkout charges EUR.
RATES_TTL_HOURS = "6"
