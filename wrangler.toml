name = "afreakcms"
pages_build_output_dir = "./dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "afreak-db"
database_id = "e8529807-3fc0-4a86-9ee4-ba1946953f22"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "afreak-products"

[vars]
# Surfaced by /api/health and the admin diagnostics page.
APP_ENV = "production"
PRODUCTION_BRANCH = "main"
MEDIA_BUCKET_NAME = "afreak-products"
SITE_URL = "https://afreak.pages.dev"
# Country used to normalise phone numbers typed without a country code.
DEFAULT_PHONE_COUNTRY = "KE"
CURRENCY = "KES"
# Fallbacks only; the editable `shipping` setting wins.
FREE_SHIPPING_THRESHOLD_CENTS = "1500000"
FLAT_SHIPPING_CENTS = "50000"
EXPRESS_SHIPPING_CENTS = "150000"
# Display-rate cache lifetime. Currencies are display-only; checkout charges the store currency (KES).
RATES_TTL_HOURS = "6"
